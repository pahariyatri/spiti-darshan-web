# Alternative to Caddy. /etc/nginx/sites-available/spiti-darshan (TLS via certbot).
proxy_cache_path /var/cache/nginx/spiti levels=1:2 keys_zone=spiti:10m max_size=200m inactive=1h use_temp_path=off;

upstream spiti_app { server 127.0.0.1:4321; keepalive 16; }

server {
  listen 80;
  server_name your-domain.example www.your-domain.example;
  return 301 https://your-domain.example$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name your-domain.example;
  ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  client_max_body_size 14m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location ~ ^/(_astro|fonts|media)/ {
    proxy_pass http://spiti_app;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ "^/uploads/[a-z0-9-]+-([0-9]+|og)\.(avif|webp|jpg)$" {
    root /srv/spiti-darshan/shared;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Public SSR pages honour the app's s-maxage (short) — never cache admin, actions or redirects.
  location ~ ^/(admin|_actions|go|api)/ {
    proxy_pass http://spiti_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://spiti_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache spiti;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_bypass $cookie_sd_admin $cookie___Host-sd_admin;
    proxy_no_cache $cookie_sd_admin $cookie___Host-sd_admin;
  }
}
