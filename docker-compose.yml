# Local development database only. Production uses a managed or host PostgreSQL (see docs/DEPLOYMENT.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: spiti-darshan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spiti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spitipass}
      POSTGRES_DB: ${POSTGRES_DB:-spiti_dev}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - spiti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spiti}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spiti_postgres_data:
