name: Bug report
description: Something on the site or admin is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://…/routes/shimla-to-spiti/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: iPhone 14, Safari
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
