version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint and @astrojs/check support TypeScript < 6.1 (2026-09); revisit when they add 7.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types must match the runtime major pinned in .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'typescript',
            'vitest',
            '@playwright/test',
            'tsx',
          ]
      database:
        patterns: ['drizzle-*', 'postgres']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
