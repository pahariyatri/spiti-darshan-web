version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'typescript',
            'vitest',
            '@playwright/test',
            'tsx',
          ]
      database:
        patterns: ['drizzle-*', 'postgres']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
